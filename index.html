   c.end=()=>{if(c.closed)return;c.closed=true;c.open=false;try{c.w&&c.w.off()}catch(e){}delete P.conns[cid];c.emit('close')};
   c.close=()=>{if(c.closed)return;P._tx(peer,{k:'x',cid});c.end()};
   c.watch=()=>{c.w=db.ref('peers/'+peer);c.w.on('value',s=>{if(!s.exists())c.end()})};
   P.conns[cid]=c;return c};
  const mkCall=(cid,peer)=>{const pc=new RTCPeerConnection(ICE.config),c=EM({peer,peerConnection:pc,cid,q:[],rd:false});
   pc.onicecandidate=e=>{if(e.candidate)P._tx(peer,{k:'ice',cid,c:JSON.stringify(e.candidate)})};
   pc.ontrack=e=>c.emit('stream',e.streams[0]||new MediaStream([e.track]));
   pc.onconnectionstatechange=()=>{if(pc.connectionState=='closed'||pc.connectionState=='failed')c.close()};
   c.add=st=>{if(st&&st.getTracks().length)st.getTracks().forEach(t=>pc.addTrack(t,st));else pc.addTransceiver('audio',{direction:'recvonly'})};
   c.flush=()=>{c.rd=true;c.q.forEach(x=>pc.addIceCandidate(x).catch(()=>{}));c.q=[]};
   c.answer=async st=>{try{c.add(st);await pc.setRemoteDescription(c.offer);c.flush();const an=await pc.createAnswer();await pc.setLocalDescription(an);P._tx(peer,{k:'ans',cid,sdp:JSON.stringify(pc.localDescription)})}catch(e){c.emit('error',e)}};
   c.close=()=>{if(c.done)return;c.done=true;try{pc.close()}catch(e){}delete P.calls[cid];c.emit('close')};
   P.calls[cid]=c;return c};
  const handle=m=>{if(!m||P.dead)return;const c=P.conns[m.cid],k=m.k;
   if(k=='conn'){const n=mkConn(m.cid,m.from,JSON.parse(m.meta||'{}'),true);n.watch();P.emit('connection',n);P._tx(m.from,{k:'ack',cid:m.cid});setTimeout(()=>n.emit('open'),0)}
   else if(k=='ack'&&c){c.open=true;c.watch();c.emit('open')}
   else if(k=='d'&&c)c.emit('data',JSON.parse(m.data));
   else if(k=='x'&&c)c.end();
   else if(k=='call'){const n=mkCall(m.cid,m.from);n.offer=JSON.parse(m.sdp);P.emit('call',n)}
   else if(k=='ans'){const n=P.calls[m.cid];if(n)n.peerConnection.setRemoteDescription(JSON.parse(m.sdp)).then(n.flush).catch(()=>{})}
   else if(k=='ice'){const n=P.calls[m.cid];if(n){const x=JSON.parse(m.c);n.rd?n.peerConnection.addIceCandidate(x).catch(()=>{}):n.q.push(x)}}};
  P.connect=(to,o)=>{const cid=rid(),c=mkConn(cid,to,(o&&o.metadata)||{},false);
   db.ref('peers/'+to).once('value').then(s=>{if(P.dead)return;if(!s.exists()){delete P.conns[cid];P.emit('error',{type:'peer-unavailable',message:'Could not connect to peer '+to})}else P._tx(to,{k:'conn',cid,meta:JSON.stringify(c.metadata)})});
   return c};
  P.call=(to,st)=>{const cid=rid(),c=mkCall(cid,to);c.add(st);
   c.peerConnection.createOffer().then(o=>c.peerConnection.setLocalDescription(o)).then(()=>P._tx(to,{k:'call',cid,sdp:JSON.stringify(c.peerConnection.localDescription)})).catch(e=>c.emit('error',e));
   return c};
  P.reconnect=()=>{};
  P.destroy=()=>{if(P.dead)return;Object.values(P.conns).forEach(c=>{if(c.open)P._tx(c.peer,{k:'x',cid:c.cid})});Object.values(P.calls).forEach(c=>c.close());P.dead=true;try{db.ref('inbox/'+id).off();db.ref('inbox/'+id).remove();db.ref('peers/'+id).remove()}catch(e){}};
  const pr=db.ref('peers/'+id),to=setTimeout(()=>fail('network'),9000);
  pr.transaction(cur=>cur?undefined:{t:Date.now()},(err,ok)=>{clearTimeout(to);if(P.dead)return;if(err||!ok)return fail('unavailable-id');
   pr.onDisconnect().remove();const ib=db.ref('inbox/'+id);ib.onDisconnect().remove();
   ib.remove().then(()=>{ib.on('child_added',s=>{const m=s.val();s.ref.remove();handle(m)});P.emit('open',id)})});
 };
}
const MICC={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false};
async function getMic(){
 let st=null;
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;st=await navigator.mediaDevices.getUserMedia(MICC);NET.micOk=true}catch(e){NET.micOk=false;st=null}
 if(!st){try{st=ac().createMediaStreamDestination().stream}catch(e){st=new MediaStream()}lobMsg('Microphone permission not granted — tap the mic button and choose Allow')}
 NET.local=st;applyMic()}
function applyMic(){try{NET.local.getAudioTracks().forEach(t=>t.enabled=micState())}catch(e){}}
async function reMic(){
 try{const st=await navigator.mediaDevices.getUserMedia(MICC);const t=st.getAudioTracks()[0];
  Object.values(NET.calls).forEach(c=>{try{const sd=c.peerConnection.getSenders().find(x=>x.track&&x.track.kind=='audio');if(sd)sd.replaceTrack(t)}catch(e){}});
  try{NET.local.getTracks().forEach(x=>x.stop())}catch(e){}
  NET.local=st;NET.micOk=true;return true}catch(e){return false}}
async function toggleMic(){
 if(!NET.local)return;
 if(!NET.micOk){if(!(await reMic())){note('Microphone is not working — allow Microphone in your browser/phone settings');return}NET.micOn=true}
 else NET.micOn=!NET.micOn;
 applyMic();pushMic()}
function pushMic(){const r=NET.roster.find(x=>x.pid===NET.myPid);if(r)r.mic=micState();
 if(NET.host){bcRoster()}else{try{NET.hostConn.send({t:'mic',on:micState()})}catch(e){}renderRoster()}}
function playRemote(pid,s){let a=NET.auds[pid];if(!a){a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a);NET.auds[pid]=a}a.srcObject=s;try{const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
function stopRemote(pid){const a=NET.auds[pid];if(a){try{a.pause();a.srcObject=null;a.remove()}catch(e){}delete NET.auds[pid]}}
function hookCall(c){NET.calls[c.peer]=c;c.on('stream',s=>playRemote(c.peer,s));c.on('close',()=>{if(NET.calls[c.peer]===c)delete NET.calls[c.peer];stopRemote(c.peer)});c.on('error',()=>{})}
function answerCall(c){try{c.answer(NET.local);hookCall(c)}catch(e){}}
function ensureCalls(){if(!NET.peer||!NET.local)return;NET.roster.forEach(r=>{if(r.pid===NET.myPid||r.gone||NET.calls[r.pid])return;if(r.seq<NET.seq){try{hookCall(NET.peer.call(r.pid,NET.local))}catch(e){}}})}

/* matchmaking: waiting match = a peer holding a fixed slot id; searchers scan slots, join one, or claim a free one */
async function findMatch(){
 if(NET.busy||NET.on)return;
 if(!($('nm').value||'').trim()){lobMsg('Type Your Name');$('nm').focus();return}try{ac()}catch(e){}
 NET.busy=true;NET.leaving=false;NET.name=myName();const tok=++NET.tok;lobMsg('');
 NET.roster=[];showSearch(true);setStat('Getting your mic and connection ready…');renderRoster();
 try{await loadPeer()}catch(e){if(tok==NET.tok){netLeave();lobMsg('Check your Internet')}return}
 if(tok!=NET.tok)return;
 await getMic();
 if(tok!=NET.tok){try{NET.local&&NET.local.getTracks().forEach(t=>t.stop())}catch(e){}NET.local=null;return}
 scan(tok)}
function mkGuest(){return new Promise(res=>{let open=false;const p=new Peer(ICE);
 p.on('open',()=>{open=true;res(p)});
 p.on('error',e=>{if(!open){try{p.destroy()}catch(x){}res(null);return}
  if(e.type=='peer-unavailable'&&NET.pend&&String(e.message||'').includes(NET.pend.id)){const f=NET.pend.res;NET.pend=null;f('free')}});
 p.on('disconnected',()=>{try{p.reconnect()}catch(x){}});
 p.on('call',answerCall)})}
function probe(p,id){return new Promise(res=>{
 let done=false,to=null;
 const fin=r=>{if(done)return;done=true;clearTimeout(to);if(NET.pend&&NET.pend.id===id)NET.pend=null;res(r)};
 NET.pend={id,res:fin};
 let c;try{c=p.connect(id,{reliable:true,serialization:'json',metadata:{name:NET.name,mic:micState()}})}catch(e){return fin('dead')}
 to=setTimeout(()=>{try{c.close()}catch(e){}fin('dead')},5000);
 c.on('data',d=>{
  if(!done){
   if(d&&d.t=='roster'){NET.hostConn=c;NET.peer=p;NET.myPid=p.id;NET.on=true;NET.host=false;fin('joined');guestData(d)}
   else{try{c.close()}catch(e){}fin('busy')}}
  else if(NET.hostConn===c)guestData(d)});
 c.on('error',()=>fin('dead'));
 c.on('close',()=>{if(!done)fin('dead');else if(NET.hostConn===c&&NET.on&&!NET.leaving&&!NET.host)hostGone()})})}
function claim(i){return new Promise(res=>{let d=false;const h=new Peer(slotId(i),ICE);
 h.on('open',()=>{d=true;res(h)});
 h.on('error',e=>{if(!d){d=true;try{h.destroy()}catch(x){}res(null)}});})}
async function scan(tok){
 const ok=()=>tok==NET.tok,K=12;setStat('Searching for players…');
 const p=await mkGuest();
 if(!ok()){try{p&&p.destroy()}catch(e){}return}
 if(!p){netLeave();lobMsg('Unable to connect the server');return}
 NET.scan=p;
 for(let tries=0;tries<30&&ok();tries++){
  let free=0;
  for(let i=1;i<=K&&ok();i++){
   const r=await probe(p,slotId(i));
   if(!ok())return;
   if(r=='joined'){NET.busy=false;NET.scan=null;setStat('Connected with the players…');return}
   if(r=='free'){free=i;break}}
  if(!ok())return;
  if(free){
   const h=await claim(free);
   if(!ok()){try{h&&h.destroy()}catch(e){}return}
   if(h){try{p.destroy()}catch(e){}NET.scan=null;becomeHost(h);return}
  }else{setStat('Slot busy, trying again…');await sleep(2500)}}
 if(ok()){netLeave();lobMsg('No match found right now, please try again later')}}
function becomeHost(h){
 NET.peer=h;NET.on=true;NET.host=true;NET.myPid=h.id;NET.seq=0;NET.seqN=1;NET.busy=false;NET.started=false;NET.starting=false;
 NET.roster=[{pid:h.id,name:NET.name,seq:0,mic:micState()}];
 h.on('connection',hostConn);h.on('call',answerCall);
 h.on('disconnected',()=>{try{h.reconnect()}catch(e){}});
 h.on('error',()=>{});
 setStat('Searching for players…');renderRoster()}
function uniq(n){let k=n,i=2;while(NET.roster.some(r=>r.name===k))k=n+i++;return k}
function hostConn(c){
 const go=()=>{
  if(NET.started||NET.roster.length>=NET.want){try{c.send({t:'no'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400);return}
  const m=c.metadata||{};NET.conns[c.peer]=c;NET.roster.push({pid:c.peer,name:uniq(String(m.name||'').slice(0,12)),seq:NET.seqN++,mic:!!m.mic});bcRoster()};
 if(c.open)go();else c.on('open',go);
 c.on('data',d=>hostData(c.peer,d));c.on('close',()=>dropPeer(c.peer));c.on('error',()=>dropPeer(c.peer))}
function bcRoster(){bc({t:'roster',r:NET.roster,w:NET.want});renderRoster();checkFull()}
function checkFull(){
 if(!NET.host||NET.started||NET.starting)return;
 if(NET.roster.filter(r=>!r.gone).length<NET.want)return;
 NET.starting=true;const tok=NET.tok;bc({t:'found'});setStat('Match found! Starting…');
 setTimeout(()=>{if(tok!=NET.tok||!NET.host)return;NET.starting=false;
  if(!NET.started&&NET.roster.filter(r=>!r.gone).length>=NET.want)hostStart();else{bc({t:'wait'});setStat('Searching for players…')}},2200)}
function dropPeer(pid){
 if(!NET.conns[pid])return;delete NET.conns[pid];
 try{NET.calls[pid]&&NET.calls[pid].close()}catch(e){}delete NET.calls[pid];stopRemote(pid);
 const r=NET.roster.find(x=>x.pid===pid);if(!r)return;
 if(NET.started&&G&&G.net&&!G.over){r.gone=true;const c=G.pc[pid];if(c!=null){G.gone[c]=true;(G.lv[c]=G.lv[c]||[]).push({l:Date.now(),b:null});msg(r.name+' left the match');checkGo();
  if(G.go&&cur()==c&&!G.busy)setTimeout(()=>{if(G.over)return;if(G.ph=='roll')botRoll();else if(G.ph=='move')botMove(c)},600)}}
 else NET.roster=NET.roster.filter(x=>x!==r);
 bcRoster()}
function hostData(pid,d){
 if(!d)return;const r=NET.roster.find(x=>x.pid===pid);
 if(d.t=='mic'){if(r){r.mic=!!d.on;bcRoster()}return}
 if(!G||!G.net||G.over||!G.pc)return;const c=G.pc[pid];if(c==null)return;
 if(d.t=='rdy'){markReady(c)}
 else if(d.t=='roll'){if(G.go&&G.ph=='roll'&&!G.busy&&cur()==c)roll();else render()}
 else if(d.t=='mv'){const i=d.i,v=d.v==null?G.d:d.v;if(G.ph=='move'&&cur()==c&&G.q.includes(v)&&choices(c,G.q).some(x=>x[0]==v&&x[1]==i)){G.d=v;G.ph='x';doMove(c,i)}else render()}}
function guestData(d){
 if(!d)return;
 if(d.t=='bye'){hostGone();return}
 if(d.t=='roster'){NET.roster=d.r;NET.want=d.w||NET.want;const me=d.r.find(x=>x.pid===NET.myPid);NET.seq=me?me.seq:0;renderRoster();ensureCalls();return}
 if(d.t=='found'){setStat('Match found! Starting…');return}
 if(d.t=='wait'){setStat('Searching for players…');return}
 if(d.t=='start'){NET.started=true;beginNet(d.act,d.names,d.pc[NET.myPid],false,d.pc);return}
 if(!G||!G.net)return;
 if(d.t=='go'){G.go=true;if(!G.setup)setMsg('Roll the dice!');render()}
 else if(d.t=='dice'){G.busy=true;sfx.roll();face(d.d,true);render()}
 else if(d.t=='fx'){try{sfx[d.n]()}catch(e){}}
 else if(d.t=='msg'){setMsg(d.m)}
 else if(d.t=='st'){const s=d.s;G.tk=s.tk;G.t=s.t;G.d=s.d;G.ph=s.ph;G.busy=s.busy;G.sixes=s.sixes;G.q=s.q||[];G.bx=!!s.bx;if(s.ph!='move')G.lsel=null;else if(G.lsel!=null&&G.q.includes(G.lsel))G.d=G.lsel;G.gone=s.gone||{};G.cap=s.cap||{};G.pk=s.pk||{};G.sb=s.sb||{};G.xp=s.xp||{};G.rl=s.rl||[];if(s.stt)G.st=s.stt;G.lv=s.lv||{};render()}
 else if(d.t=='over'){showOver(d.p)}}
function hostGone(){netLeave();go('vc');lobMsg('The host left — tap Match making to try again')}
function micBtn(r,own){const e=document.createElement(own?'button':'span');e.className='mk '+(r.mic?'on':'off');e.innerHTML=r.mic?MIC_ON:MIC_OFF;if(own){e.onclick=toggleMic;e.setAttribute('aria-label',r.mic?'Turn mic off':'Turn mic on')}return e}
function renderRoster(){
 const L=$('ros');
 if(L){L.innerHTML='';const cols=COLS(NET.want),act=NET.roster.filter(r=>!r.gone);
  for(let i=0;i<NET.want;i++){const r=act[i],row=document.createElement('div'),dot=document.createElement('span'),n=document.createElement('div');
   row.className='rr'+(r?'':' em');dot.className='dot';dot.style.color=COL[cols[i]];n.className='nm';
   if(r){n.textContent=r.name;if(r.pid===NET.myPid){const sm=document.createElement('small');sm.textContent='You';n.appendChild(sm)}row.append(dot,n,micBtn(r,r.pid===NET.myPid))}
   else{n.textContent='Waiting…';row.append(dot,n)}
   L.appendChild(row)}
  $('cnt').textContent=Math.min(act.length,NET.want)+' / '+NET.want}
 if(G&&G.net&&G.pc){const v=$('vs');v.innerHTML='';G.act.forEach(c=>{const r=NET.roster.find(x=>G.pc[x.pid]===c);if(!r)return;const own=r.pid===NET.myPid,d=document.createElement('div');d.className='vch'+(r.gone?' gn':'');d.style.borderColor=COL[c];
  const lt=document.createElement('span');lt.className='lt';const lc=r.gone?'#ff2d4a':'#00ff7f';lt.style.background=lc;lt.style.boxShadow='0 0 8px '+lc;d.appendChild(lt);const n=document.createElement('span');n.className='n';n.textContent=r.name;d.appendChild(n);d.appendChild(micBtn(r,own));v.appendChild(d)});setTimeout(fit,0)}}
function hostStart(){
 if(!NET.host||NET.started)return;NET.roster=NET.roster.filter(r=>!r.gone);if(NET.roster.length<2)return;
 NET.started=true;const n=NET.roster.length,act=COLS(n),names={},pc={};
 NET.roster.forEach((r,i)=>{names[act[i]]=r.name;pc[r.pid]=act[i]});
 bc({t:'start',act,names,pc});beginNet(act,names,pc[NET.myPid],true,pc)}
function beginNet(act,names,me,host,pc){
 G={mode:'net',net:true,host,me,lvl:-1,act,names,pc,tk:{},t:0,d:0,ph:'roll',sixes:0,q:[],bx:false,busy:false,over:false,gone:{},ready:{},go:false,cap:{}};
 act.forEach(p=>G.tk[p]=[-1,-1,-1,-1]);G.st=mkSt(act);G.sb={};G.xp={};G.rl=[];G.lv={};G.t0=Date.now();G.pk={};act.forEach(p=>G.pk[p]=[-1,-1,-1,-1]);
 $('vs').style.display='flex';go('game');build();bset(RZ,RX);face(1);render();renderRoster();G.setup=true;$('setup').style.display='flex';document.querySelector('.ctl').style.display='none';$('stage').style.touchAction='none';setMsg('Rotate / tilt the board, then tap Set');fit();setTimeout(fit,60);setTimeout(fit,400);
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{NET.wl=w}).catch(()=>{})}catch(e){}}
function markReady(c){G.ready[c]=true;checkGo()}
function checkGo(){if(!G||!G.net||G.go)return;if(G.act.every(c=>G.ready[c]||G.gone[c])){G.go=true;bc({t:'go'});if(!G.setup)msg('Roll the dice!');render()}}
function uiRoll(){if(!G||G.over)return;if(!G.net){roll();return}
 if(G.ph!='roll'||G.busy||cur()!=G.me||!G.go)return;
 if(G.host)roll();else{G.busy=true;try{NET.hostConn.send({t:'roll'})}catch(e){}render()}}
function netLeave(){
 NET.tok++;NET.leaving=true;try{if(NET.host)bc({t:'bye'})}catch(e){}
 Object.values(NET.calls).forEach(c=>{try{c.close()}catch(e){}});
 Object.values(NET.conns).forEach(c=>{try{c.close()}catch(e){}});
 try{NET.hostConn&&NET.hostConn.close()}catch(e){}
 try{NET.scan&&NET.scan.destroy()}catch(e){}
 try{NET.peer&&NET.peer.destroy()}catch(e){}
 Object.keys(NET.auds).forEach(stopRemote);
 try{NET.local&&NET.local.getTracks().forEach(t=>t.stop())}catch(e){}
 try{NET.wl&&NET.wl.release()}catch(e){}
 if(G&&G.net)G.over=true;
 Object.assign(NET,{on:false,host:false,peer:null,scan:null,seq:0,seqN:1,myPid:'',conns:{},calls:{},auds:{},roster:[],local:null,micOn:true,micOk:false,hostConn:null,started:false,starting:false,busy:false,leaving:false,wl:null,pend:null});
 showSearch(false);$('vs').innerHTML=''}
function vcBack(stay){netLeave();if(!stay)go('menu');else lobMsg('')}
function back(){if(G&&G.net&&NET.on){netLeave();go('vc')}else go('menu')}
function endBtn(){if(G&&G.net){netLeave();$('vs').style.display='none';go('vc')}else go('menu')}
